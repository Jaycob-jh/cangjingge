project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "people/*.qmd"
    - "research/*.qmd"
    - "library/*.qmd"
    - "library/papers/*.qmd"
    - "notes/*.qmd"
    - "notes/posts/*.qmd"
    - "publications/*.qmd"
    - "join/*.qmd"

website:
  title: "藏经阁 Cangjingge"
  site-url: https://jaycob-jh.github.io/cangjingge/
  repo-url: https://github.com/Jaycob-jh/cangjingge
  description: "神经调控与脑连接组学文献、研读札记及可回溯的科研证据索引。"
  favicon: assets/favicon.svg
  open-graph: true
  navbar:
    background: "#152b40"
    foreground: "#ffffff"
    left:
      - text: "首页"
        href: index.qmd
      - text: "典籍索引"
        href: library/index.qmd
      - text: "研读札记"
        href: notes/index.qmd
      - text: "专题评述"
        href: research/index.qmd
      - text: "团队与贡献"
        menu:
          - text: "阁中学人"
            href: people/index.qmd
          - text: "学术成果"
            href: publications/index.qmd
          - text: "共建指南"
            href: join/index.qmd
    right:
      - icon: github
        href: https://github.com/Jaycob-jh/cangjingge
        aria-label: GitHub 仓库
  search:
    location: navbar
    type: overlay
    limit: 20
  page-footer:
    left: "© 2026 藏经阁 · 文献与知识共建"
    right: "Quarto × GitHub Pages · 开放共享、尊重版权"
  back-to-top-navigation: true

format:
  html:
    theme: cosmo
    css: assets/styles.css
    lang: zh
    toc: true
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true

execute:
  freeze: auto
